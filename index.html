    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --gold-color: #fbbf24;
            --card-border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 24px 16px; 
        }

        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 1.8rem; color: var(--accent-color); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; }
        header p { color: var(--text-sub); font-size: 0.95rem; }

        .controls { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 24px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 100%;
            max-width: 520px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 140px;
        }

        .control-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-left: 2px;
            font-weight: 600;
        }

        select { 
            background-color: var(--card-bg); 
            color: var(--text-main); 
            border: 1px solid var(--card-border); 
            padding: 10px 14px; 
            border-radius: 10px; 
            font-size: 0.9rem; 
            outline: none; 
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .card-container { width: 100%; max-width: 480px; height: 390px; perspective: 1000px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .card.flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 20px; 
            background-color: var(--card-bg); 
            border: 1px solid var(--card-border); 
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); 
            display: flex; 
            flex-direction: column; 
            padding: 24px; 
            justify-content: space-between; 
        }

        .card-back { transform: rotateY(180deg); overflow-y: auto; }

        .badge { 
            align-self: flex-start; 
            background-color: rgba(56, 189, 248, 0.12); 
            color: var(--accent-color); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .main-word { text-align: center; margin: auto 0; }
        .main-word h2 { font-size: 2.2rem; color: var(--text-main); margin-bottom: 10px; font-weight: 700; }
        .phonetic { color: var(--gold-color); font-size: 1.1rem; font-style: italic; letter-spacing: 0.5px; }

        .audio-btn { 
            background-color: var(--accent-color); 
            color: #0b132b; 
            border: none; 
            padding: 10px 24px; 
            border-radius: 25px; 
            font-size: 0.95rem;
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin: 0 auto; 
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .audio-btn:active {
            transform: scale(0.96);
        }

        .lang-list { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 4px; }
        .lang-item { border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
        .lang-item:last-child { border-bottom: none; }
        .lang-label { font-size: 0.75rem; color: var(--text-sub); display: block; margin-bottom: 2px; }
        .lang-text { font-size: 1rem; font-weight: 600; color: var(--text-main); }
        .lang-example { font-size: 0.85rem; color: #cbd5e1; margin-top: 3px; line-height: 1.3; }

        .note-box { 
            background-color: rgba(251, 191, 36, 0.08); 
            border-left: 3px solid var(--gold-color); 
            padding: 10px 14px; 
            font-size: 0.85rem; 
            color: #fde68a; 
            margin-top: 10px; 
            border-radius: 0 8px 8px 0; 
            line-height: 1.4;
        }

        .nav-buttons { display: flex; gap: 24px; margin-top: 24px; align-items: center; }
        .nav-btn { 
            background-color: var(--card-bg); 
            border: 1px solid var(--card-border); 
            color: var(--text-main); 
            padding: 10px 24px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s;
        }

        .nav-btn:hover {
            background-color: #24304f;
        }

        .hint { color: var(--text-sub); font-size: 0.85rem; margin-top: 14px; }
    </style>
</head>

                <option value="id">Bahasa Indonesia</option>

        <div class="control-group" style="flex: 2 1 200px;">

            <select id="categorySelect" onchange="filterCategory()">

        </div>

                <option value="male" id="optMale">男聲 (Male)</option>

    </div>

                <button class="audio-btn" onclick="event.stopPropagation(); playSpeech();">

            </div>

            <!-- 反面 -->
            <div class="card-back card-face">
                <div class="lang-list" id="backLangList"></div>
                <div class="note-box" id="noteBox"></div>
            </div>
        </div>
    </div>

        let filteredCards = [...allFlashcards];
        let currentIndex = 0;
        let availableVoices = [];

        function loadVoices() {
            if ('speechSynthesis' in window) {
                availableVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // 當使用者切換主語言時觸發
        function onLanguageChange() {
            const currentLang = document.getElementById('langSelect').value;
            const dict = uiI18n[currentLang] || uiI18n['zh'];

            // 1. 更新 UI 文字
            document.getElementById('uiTitle').innerText = dict.title;
            document.getElementById('uiSubtitle').innerText = dict.subtitle;
            document.getElementById('lblLangSelect').innerText = dict.lblLang;
            document.getElementById('lblCategorySelect').innerText = dict.lblCat;
            document.getElementById('lblGenderSelect').innerText = dict.lblGender;
            document.getElementById('btnAudioText').innerText = dict.btnAudio;
            document.getElementById('uiHint').innerText = dict.hint;
            document.getElementById('btnPrev').innerText = dict.btnPrev;
            document.getElementById('btnNext').innerText = dict.btnNext;
            document.getElementById('optFemale').innerText = dict.optFemale;
            document.getElementById('optMale').innerText = dict.optMale;

            // 2. 動態重構主題選單
            const catSelect = document.getElementById('categorySelect');
            const savedCat = catSelect.value || 'ALL';
            
            let catOptionsHtml = `<option value="ALL">${dict.allCat}</option>`;
            const catKeys = ["顧客接待", "職場團隊溝通", "日常生活關懷", "生活需求指示", "現場請託協助", "基礎數字", "進階數字與結帳", "餐飲與點餐", "稱呼與日常應答", "方向與交通"];
            
            catKeys.forEach(key => {
                const label = dict.categories[key] || key;
                catOptionsHtml += `<option value="${key}">${label}</option>`;
            });
            
            catSelect.innerHTML = catOptionsHtml;
            catSelect.value = savedCat;

            // 3. 重新渲染字卡與反面資訊
            filterCategory();
        }

        function filterCategory() {
            const selectedCat = document.getElementById('categorySelect').value;
            if (selectedCat === 'ALL') {
                filteredCards = [...allFlashcards];
            } else {
                filteredCards = allFlashcards.filter(card => card.category === selectedCat);
            }
            currentIndex = 0;
            resetFlipAndRender();
        }

        function renderCard() {
            if (filteredCards.length === 0) return;
            const cardData = filteredCards[currentIndex];
            const currentLang = document.getElementById('langSelect').value;
            const langObj = cardData[currentLang] || cardData['zh'];
            const dict = uiI18n[currentLang] || uiI18n['zh'];

            // 卡片類別標籤顯示主語言譯名
            const catTranslated = (dict.categories && dict.categories[cardData.category]) ? dict.categories[cardData.category] : cardData.category;
            document.getElementById('cardCategory').innerText = catTranslated;

            document.getElementById('frontWord').innerText = langObj.word;
            document.getElementById('frontPhonetic').innerText = langObj.phonetic ? `[ ${langObj.phonetic} ]` : "";

            const langNames = { zh: "中文", en: "English", vi: "Tiếng Việt", id: "Bahasa Indonesia", balinese: "Basa Bali (敬語)" };
            let backHtml = "";
            for (let langKey in langNames) {
                if (cardData[langKey]) {
                    backHtml += `
                        <div class="lang-item">
                            <span class="lang-label">${langNames[langKey]}</span>
                            <div class="lang-text">${cardData[langKey].word} <small style="color:var(--gold-color)">${cardData[langKey].phonetic ? '(' + cardData[langKey].phonetic + ')' : ''}</small></div>
                            <div class="lang-example">${cardData[langKey].example || ''}</div>
                        </div>`;
                }
            }
            document.getElementById('backLangList').innerHTML = backHtml;

            const noteBox = document.getElementById('noteBox');
            if (cardData.note) {
                noteBox.style.display = 'block';
                noteBox.innerText = "💡 " + cardData.note;
            } else {
                noteBox.style.display = 'none';
            }

            document.getElementById('cardProgress').innerText = `${currentIndex + 1} / ${filteredCards.length}`;
        }

        function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
        function updateCardDisplay() { renderCard(); }
        function prevCard() { if (currentIndex > 0) { currentIndex--; resetFlipAndRender(); } }
        function nextCard() { if (currentIndex < filteredCards.length - 1) { currentIndex++; resetFlipAndRender(); } }
        function resetFlipAndRender() { document.getElementById('card').classList.remove('flipped'); setTimeout(renderCard, 150); }

        function playSpeech() {
            const currentLang = document.getElementById('langSelect').value;
            const preferredGender = document.getElementById('genderSelect').value;
            const cardData = filteredCards[currentIndex];
            const text = cardData[currentLang] ? cardData[currentLang].word : cardData['zh'].word;

            const langCodeMap = { zh: 'zh-TW', en: 'en-US', vi: 'vi-VN', id: 'id-ID', balinese: 'id-ID' };
            const targetLang = langCodeMap[currentLang] || 'zh-TW';

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = targetLang;

                if (availableVoices.length === 0) loadVoices();
                const matchedVoices = availableVoices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(targetLang.slice(0, 2).toLowerCase()));

                if (matchedVoices.length > 0) {
                    let chosenVoice = matchedVoices.find(v => {
                        const name = v.name.toLowerCase();
                        if (preferredGender === 'male') {
                            return name.includes('male') || name.includes('david') || name.includes('george') || name.includes('kangkang') || name.includes('boy') || name.includes('man');
                        } else {
                            return name.includes('female') || name.includes('zira') || name.includes('yating') || name.includes('hsiao') || name.includes('girl') || name.includes('woman') || name.includes('mei-jia');
                        }
                    });

                    if (!chosenVoice) chosenVoice = matchedVoices[0];
                    utterance.voice = chosenVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Your browser does not support text-to-speech.");
            }
        }

        // 頁面初始化
        onLanguageChange();
    </script>
