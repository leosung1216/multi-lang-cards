<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飯店餐飲多語學習字卡系統</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --gold-color: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; color: var(--accent-color); margin-bottom: 6px; }
        header p { color: var(--text-sub); font-size: 0.95rem; }

        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; cursor: pointer; }

        .card-container { width: 100%; max-width: 480px; height: 380px; perspective: 1000px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; background-color: var(--card-bg); border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding: 25px; justify-content: space-between; }
        .card-back { transform: rotateY(180deg); overflow-y: auto; }

        .badge { align-self: flex-start; background-color: rgba(56, 189, 248, 0.1); color: var(--accent-color); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .main-word { text-align: center; margin: auto 0; }
        .main-word h2 { font-size: 2rem; color: var(--text-main); margin-bottom: 8px; }
        .phonetic { color: var(--gold-color); font-size: 1.05rem; font-style: italic; }

        .audio-btn { background-color: var(--accent-color); color: #0f172a; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0 auto; }
        
        .lang-list { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 5px; }
        .lang-item { border-bottom: 1px solid #334155; padding-bottom: 6px; }
        .lang-item:last-child { border-bottom: none; }
        .lang-label { font-size: 0.75rem; color: var(--text-sub); display: block; }
        .lang-text { font-size: 0.95rem; font-weight: 500; color: var(--text-main); }
        .lang-example { font-size: 0.8rem; color: #cbd5e1; margin-top: 2px; }

        .note-box { background-color: rgba(251, 191, 36, 0.1); border-left: 3px solid var(--gold-color); padding: 8px 12px; font-size: 0.8rem; color: #fde68a; margin-top: 8px; border-radius: 0 4px 4px 0; }
        .nav-buttons { display: flex; gap: 20px; margin-top: 20px; }
        .nav-btn { background-color: var(--card-bg); border: 1px solid #334155; color: var(--text-main); padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .hint { color: var(--text-sub); font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>飯店餐飲多語學習字卡</h1>
        <p>涵蓋 中・英・越・印尼・峇里島語</p>
    </header>

    <div class="controls">
        <!-- 分類選擇器 -->
        <select id="categorySelect" onchange="filterCategory()">
            <option value="ALL">所有主題分類 (共 40 組)</option>
            <option value="顧客接待">模組一：顧客接待與問候</option>
            <option value="職場團隊溝通">模組四：職場團隊溝通</option>
            <option value="日常生活關懷">模組：日常生活與關懷</option>
        </select>

        <!-- 語言選擇器 -->
        <select id="langSelect" onchange="updateCardDisplay()">
            <option value="zh">主語言：中文</option>
            <option value="en">Main: English</option>
            <option value="vi">Chính: Tiếng Việt</option>
            <option value="id">Utama: B. Indonesia</option>
            <option value="balinese">Utama: Basa Bali</option>
        </select>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <!-- 正面 -->
            <div class="card-face">
                <span class="badge" id="cardCategory">分類</span>
                <div class="main-word">
                    <h2 id="frontWord">單字</h2>
                    <p class="phonetic" id="frontPhonetic">拼音</p>
                </div>
                <button class="audio-btn" onclick="event.stopPropagation(); playSpeech();">🔊 發音</button>
            </div>

            <!-- 反面 -->
            <div class="card-back card-face">
                <div class="lang-list" id="backLangList"></div>
                <div class="note-box" id="noteBox"></div>
            </div>
        </div>
    </div>

    <p class="hint">💡 點擊卡片可翻面查看全語言對照與例句</p>

    <div class="nav-buttons">
        <button class="nav-btn" onclick="prevCard()">上一張</button>
        <span id="cardProgress" style="align-self: center; color: var(--text-sub);">1 / 1</span>
        <button class="nav-btn" onclick="nextCard()">下一張</button>
    </div>

        let filteredCards = [...allFlashcards];
        let currentIndex = 0;

        function filterCategory() {
            const selectedCat = document.getElementById('categorySelect').value;
            if (selectedCat === 'ALL') {
                filteredCards = [...allFlashcards];
            } else {
                filteredCards = allFlashcards.filter(card => card.category === selectedCat);
            }
            currentIndex = 0;
            resetFlipAndRender();
        }

        function renderCard() {
            if (filteredCards.length === 0) return;
            const cardData = filteredCards[currentIndex];
            const currentLang = document.getElementById('langSelect').value;
            const langObj = cardData[currentLang] || cardData['zh'];

            document.getElementById('cardCategory').innerText = cardData.category || "一般";
            document.getElementById('frontWord').innerText = langObj.word;
            document.getElementById('frontPhonetic').innerText = langObj.phonetic ? `[ ${langObj.phonetic} ]` : "";

            const langNames = { zh: "中文", en: "English", vi: "Tiếng Việt", id: "Bahasa Indonesia", balinese: "Basa Bali (敬語)" };
            let backHtml = "";
            for (let langKey in langNames) {
                if (cardData[langKey]) {
                    backHtml += `
                        <div class="lang-item">
                            <span class="lang-label">${langNames[langKey]}</span>
                            <div class="lang-text">${cardData[langKey].word} <small style="color:var(--gold-color)">${cardData[langKey].phonetic ? '(' + cardData[langKey].phonetic + ')' : ''}</small></div>
                            <div class="lang-example">${cardData[langKey].example || ''}</div>
                        </div>`;
                }
            }
            document.getElementById('backLangList').innerHTML = backHtml;

            const noteBox = document.getElementById('noteBox');
            if (cardData.note) {
                noteBox.style.display = 'block';
                noteBox.innerText = "💡 " + cardData.note;
            } else {
                noteBox.style.display = 'none';
            }

            document.getElementById('cardProgress').innerText = `${currentIndex + 1} / ${filteredCards.length}`;
        }

        function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
        function updateCardDisplay() { renderCard(); }
        function prevCard() { if (currentIndex > 0) { currentIndex--; resetFlipAndRender(); } }
        function nextCard() { if (currentIndex < filteredCards.length - 1) { currentIndex++; resetFlipAndRender(); } }
        function resetFlipAndRender() { document.getElementById('card').classList.remove('flipped'); setTimeout(renderCard, 150); }

        function playSpeech() {
            const currentLang = document.getElementById('langSelect').value;
            const cardData = filteredCards[currentIndex];
            const text = cardData[currentLang] ? cardData[currentLang].word : cardData['zh'].word;
            const langCodeMap = { zh: 'zh-TW', en: 'en-US', vi: 'vi-VN', id: 'id-ID', balinese: 'id-ID' };

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCodeMap[currentLang] || 'zh-TW';
                window.speechSynthesis.speak(utterance);
            }
        }

        renderCard();
    </script>
</body>
</html>
