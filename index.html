<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飯店餐飲多語學習字卡系統</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --gold-color: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; color: var(--accent-color); margin-bottom: 6px; }
        header p { color: var(--text-sub); font-size: 0.95rem; }

        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; cursor: pointer; }

        .card-container { width: 100%; max-width: 480px; height: 380px; perspective: 1000px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; background-color: var(--card-bg); border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding: 25px; justify-content: space-between; }
        .card-back { transform: rotateY(180deg); overflow-y: auto; }

        .badge { align-self: flex-start; background-color: rgba(56, 189, 248, 0.1); color: var(--accent-color); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .main-word { text-align: center; margin: auto 0; }
        .main-word h2 { font-size: 2rem; color: var(--text-main); margin-bottom: 8px; }
        .phonetic { color: var(--gold-color); font-size: 1.05rem; font-style: italic; }

        .audio-btn { background-color: var(--accent-color); color: #0f172a; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0 auto; }
        
        .lang-list { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 5px; }
        .lang-item { border-bottom: 1px solid #334155; padding-bottom: 6px; }
        .lang-item:last-child { border-bottom: none; }
        .lang-label { font-size: 0.75rem; color: var(--text-sub); display: block; }
        .lang-text { font-size: 0.95rem; font-weight: 500; color: var(--text-main); }
        .lang-example { font-size: 0.8rem; color: #cbd5e1; margin-top: 2px; }

        .note-box { background-color: rgba(251, 191, 36, 0.1); border-left: 3px solid var(--gold-color); padding: 8px 12px; font-size: 0.8rem; color: #fde68a; margin-top: 8px; border-radius: 0 4px 4px 0; }
        .nav-buttons { display: flex; gap: 20px; margin-top: 20px; }
        .nav-btn { background-color: var(--card-bg); border: 1px solid #334155; color: var(--text-main); padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .hint { color: var(--text-sub); font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>飯店餐飲多語學習字卡</h1>
        <p>涵蓋 中・英・越・印尼・峇里島語</p>
    </header>

    <div class="controls">
        <!-- 分類選擇器 -->
        <select id="categorySelect" onchange="filterCategory()">
            <option value="ALL">所有主題分類</option>
            <option value="顧客接待">模組一：顧客接待與問候</option>
            <option value="職場團隊溝通">模組四：職場團隊溝通</option>
            <option value="日常生活關懷">模組：日常生活與關懷</option>
            <option value="生活需求指示">模組：生活需求與指示</option>
            <option value="現場請託協助">模組：現場請託與協助</option>
            <option value="數字">模組：數字學習</option>
            <option value="餐飲與點餐">模組：餐飲與點餐</option>
            <option value="旅遊與交通">模組：旅遊與交通</option>
            <option value="稱呼與日常">模組：稱呼與日常</option>
            <option value="問候與方向">模組：問候與方向</option>
            <option value="狀態與進階數字">模組：狀態與進階數字</option>
            <option value="進階數字與結帳">模組：進階數字與結帳</option>
            <option value="職場與團隊">模組：職場與團隊</option>
        </select>

        <!-- 語言選擇器 -->
        <select id="langSelect" onchange="updateCardDisplay()">
            <option value="zh">主語言：中文</option>
            <option value="en">Main: English</option>
            <option value="vi">Chính: Tiếng Việt</option>
            <option value="id">Utama: B. Indonesia</option>
            <option value="balinese">Utama: Basa Bali</option>
        </select>

        <!-- 語音性別選擇器 -->
        <select id="genderSelect">
            <option value="female">語音性別：女聲 (偏好)</option>
            <option value="male">語音性別：男聲 (偏好)</option>
        </select>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <!-- 正面 -->
            <div class="card-face">
                <span class="badge" id="cardCategory">分類</span>
                <div class="main-word">
                    <h2 id="frontWord">單字</h2>
                    <p class="phonetic" id="frontPhonetic">拼音</p>
                </div>
                <button class="audio-btn" onclick="event.stopPropagation(); playSpeech();">🔊 發音</button>
            </div>

            <!-- 反面 -->
            <div class="card-back card-face">
                <div class="lang-list" id="backLangList"></div>
                <div class="note-box" id="noteBox"></div>
            </div>
        </div>
    </div>

    <p class="hint">💡 點擊卡片可翻面查看全語言對照與例句</p>

    <div class="nav-buttons">
        <button class="nav-btn" onclick="prevCard()">上一張</button>
        <span id="cardProgress" style="align-self: center; color: var(--text-sub);">1 / 1</span>
        <button class="nav-btn" onclick="nextCard()">下一張</button>
    </div>

    <script>
        const allFlashcards = [
            // --- 顧客接待與問候 ---
            {
                "id": "recv_001", "category": "顧客接待",
                "zh": { "word": "歡迎光臨", "phonetic": "huān yíng guāng lín", "example": "歡迎光臨，請問今天有預約嗎？" },
                "en": { "word": "Welcome", "phonetic": "wel-kuhm", "example": "Welcome! Do you have a reservation today?" },
                "vi": { "word": "Chào mừng", "phonetic": "chao mung", "example": "Chào mừng quý khách, anh/chị đã đặt bàn chưa ạ?" },
                "id": { "word": "Selamat datang", "phonetic": "seh-la-mat dah-tang", "example": "Selamat datang, apakah Anda sudah membuat reservasi?" },
                "balinese": { "word": "Rahajeng rauh", "phonetic": "ra-ha-jeng ra-uh", "example": "Rahajeng rauh, titiang jagi ngawantu." },
                "note": "Rahajeng rauh 為正式歡迎用語，Om Swastyastu 亦可用於合十禮問候。"
            },
            {
                "id": "recv_002", "category": "顧客接待",
                "zh": { "word": "早安", "phonetic": "zǎo ān", "example": "賓客早安，這邊請入座。" },
                "en": { "word": "Good morning", "phonetic": "good mor-ning", "example": "Good morning, please follow me to your table." },
                "vi": { "word": "Chào buổi sáng", "phonetic": "chao bu-oi sang", "example": "Chào buổi sáng, mời quý khách vào chỗ." },
                "id": { "word": "Selamat pagi", "phonetic": "se-la-mat pa-gi", "example": "Selamat pagi, silakan masuk." },
                "balinese": { "word": "Rahajeng semeng", "phonetic": "ra-ha-jeng se-meng", "example": "Rahajeng semeng, durusang meliang." },
                "note": "早餐時段高頻招呼語。"
            },
            {
                "id": "recv_003", "category": "顧客接待",
                "zh": { "word": "午安", "phonetic": "wǔ ān", "example": "賓客午安，今天想品嚐點什麼？" },
                "en": { "word": "Good afternoon", "phonetic": "good af-ter-noon", "example": "Good afternoon, what would you like to have today?" },
                "vi": { "word": "Chào buổi trưa", "phonetic": "chao bu-oi trua", "example": "Chào buổi trưa, quý khách dùng gì ạ?" },
                "id": { "word": "Selamat siang", "phonetic": "se-la-mat si-ang", "example": "Selamat siang, mau pesan apa hari ini?" },
                "balinese": { "word": "Rahajeng tengai", "phonetic": "ra-ha-jeng te-ngai", "example": "Rahajeng tengai, durusang majengan." },
                "note": "午餐時段招呼語。"
            },
            {
                "id": "recv_004", "category": "顧客接待",
                "zh": { "word": "晚安 / 祝好眠", "phonetic": "wǎn ān", "example": "祝您今晚用餐愉快，晚安。" },
                "en": { "word": "Good evening", "phonetic": "good ee-vning", "example": "Have a wonderful dinner, good evening." },
                "vi": { "word": "Chào buổi tối", "phonetic": "chao bu-oi toi", "example": "Chúc quý khách ăn tối vui vẻ, chào buổi tối." },
                "id": { "word": "Selamat malam", "phonetic": "se-la-mat ma-lam", "example": "Selamat menikmati makan malam, selamat malam." },
                "balinese": { "word": "Rahajeng wengi", "phonetic": "ra-ha-jeng weng-i", "example": "Rahajeng wengi, suksma sampun rauh." },
                "note": "晚餐時段接待與道別用語。"
            },

            // --- 數字模組 ---
            {
                "id": "num_001", "category": "數字",
                "zh": {"word": "一", "phonetic": "yī", "example": "一位客人。"},
                "en": {"word": "One", "phonetic": "wuhn", "example": "One guest."},
                "vi": {"word": "Một", "phonetic": "moht", "example": "Một khách."},
                "id": {"word": "Satu", "phonetic": "sa-tu", "example": "Satu tamu."},
                "balinese": {"word": "Asiki", "phonetic": "a-si-ki", "example": "Tamiu asiki."},
                "note": "數字 1，敬語為 Asiki"
            },
            {
                "id": "num_002", "category": "數字",
                "zh": {"word": "二", "phonetic": "èr", "example": "兩份餐。"},
                "en": {"word": "Two", "phonetic": "too", "example": "Two portions."},
                "vi": {"word": "Hai", "phonetic": "hai", "example": "Hai phần."},
                "id": {"word": "Dua", "phonetic": "du-a", "example": "Dua porsi."},
                "balinese": {"word": "Kalih", "phonetic": "ka-lih", "example": "Kalih porsi."},
                "note": "數字 2，敬語為 Kalih"
            },
            {
                "id": "num_003", "category": "數字",
                "zh": {"word": "三", "phonetic": "sān", "example": "三杯水。"},
                "en": {"word": "Three", "phonetic": "three", "example": "Three glasses of water."},
                "vi": {"word": "Ba", "phonetic": "ba", "example": "Ba ly nước."},
                "id": {"word": "Tiga", "phonetic": "ti-ga", "example": "Tiga gelas air."},
                "balinese": {"word": "Tiga", "phonetic": "ti-ga", "example": "Tiga toya."},
                "note": "數字 3，敬語為 Tiga"
            },

            // --- 餐飲與點餐 ---
            {
                "id": "rest_011", "category": "餐飲與點餐",
                "zh": {"word": "美味", "phonetic": "měi wèi", "example": "這很美味。"},
                "en": {"word": "Delicious", "phonetic": "dih-lish-uhs", "example": "This is delicious."},
                "vi": {"word": "Ngon", "phonetic": "ngon", "example": "Món này ngon."},
                "id": {"word": "Enak", "phonetic": "e-nak", "example": "Ini enak."},
                "balinese": {"word": "Jaen", "phonetic": "ja-en", "example": "Puniki jaen."},
                "note": "稱讚食物"
            },
            {
                "id": "rest_013", "category": "餐飲與點餐",
                "zh": {"word": "水", "phonetic": "shuǐ", "example": "請給我水。"},
                "en": {"word": "Water", "phonetic": "wa-ter", "example": "Water, please."},
                "vi": {"word": "Nước", "phonetic": "nuoc", "example": "Cho tôi nước."},
                "id": {"word": "Air", "phonetic": "a-ir", "example": "Minta air."},
                "balinese": {"word": "Toya", "phonetic": "to-ya", "example": "Nunas toya."},
                "note": "飲用水"
            },

            // --- 日常生活關懷 ---
            {
                "id": "life_001", "category": "日常生活關懷",
                "zh": { "word": "吃飯了嗎？", "phonetic": "chī fàn le ma", "example": "夥伴早安，你吃飯了嗎？" },
                "en": { "word": "Have you eaten?", "phonetic": "hav yoo ee-tn", "example": "Good morning! Have you eaten yet?" },
                "vi": { "word": "Ăn cơm chưa?", "phonetic": "an com chua", "example": "Chào bạn, bạn đã ăn cơm chưa?" },
                "id": { "word": "Sudah makan?", "phonetic": "su-dah ma-kan", "example": "Halo, apakah kamu sudah makan?" },
                "balinese": { "word": "Sampun ngajeng?", "phonetic": "sam-pun nga-jeng", "example": "Om Swastyastu, sampun ngajeng?" },
                "note": "最經典且具親切感的日常問候用語。"
            },

            // --- 職場團隊溝通 ---
            {
                "id": "team_001", "category": "職場團隊溝通",
                "zh": { "word": "收到 / 了解", "phonetic": "shōu dào / liǎo jiě", "example": "收到，這桌立刻補水。" },
                "en": { "word": "Got it / Understood", "phonetic": "got it / uhn-der-stood", "example": "Got it, I will refill the water right away." },
                "vi": { "word": "Đã hiểu / Rõ rồi", "phonetic": "da hieu / ro roi", "example": "Rõ rồi, tôi sẽ rót nước ngay." },
                "id": { "word": "Siap / Mengerti", "phonetic": "si-ap / me-nger-ti", "example": "Siap, saya isi airnya sekarang." },
                "balinese": { "word": "Sampun uning", "phonetic": "sam-pun u-ning", "example": "Sampun uning, titiang ngurusang." },
                "note": "職場接受指令時的回報用語。"
            }
        ];

        let filteredCards = [...allFlashcards];
        let currentIndex = 0;
        let availableVoices = [];

        // 初始化加載設備支援的語音
        function loadVoices() {
            if ('speechSynthesis' in window) {
                availableVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function filterCategory() {
            const selectedCat = document.getElementById('categorySelect').value;
            if (selectedCat === 'ALL') {
                filteredCards = [...allFlashcards];
            } else {
                filteredCards = allFlashcards.filter(card => card.category === selectedCat);
            }
            currentIndex = 0;
            resetFlipAndRender();
        }

        function renderCard() {
            if (filteredCards.length === 0) return;
            const cardData = filteredCards[currentIndex];
            const currentLang = document.getElementById('langSelect').value;
            const langObj = cardData[currentLang] || cardData['zh'];

            document.getElementById('cardCategory').innerText = cardData.category || "一般";
            document.getElementById('frontWord').innerText = langObj.word;
            document.getElementById('frontPhonetic').innerText = langObj.phonetic ? `[ ${langObj.phonetic} ]` : "";

            const langNames = { zh: "中文", en: "English", vi: "Tiếng Việt", id: "Bahasa Indonesia", balinese: "Basa Bali (敬語)" };
            let backHtml = "";
            for (let langKey in langNames) {
                if (cardData[langKey]) {
                    backHtml += `
                        <div class="lang-item">
                            <span class="lang-label">${langNames[langKey]}</span>
                            <div class="lang-text">${cardData[langKey].word} <small style="color:var(--gold-color)">${cardData[langKey].phonetic ? '(' + cardData[langKey].phonetic + ')' : ''}</small></div>
                            <div class="lang-example">${cardData[langKey].example || ''}</div>
                        </div>`;
                }
            }
            document.getElementById('backLangList').innerHTML = backHtml;

            const noteBox = document.getElementById('noteBox');
            if (cardData.note) {
                noteBox.style.display = 'block';
                noteBox.innerText = "💡 " + cardData.note;
            } else {
                noteBox.style.display = 'none';
            }

            document.getElementById('cardProgress').innerText = `${currentIndex + 1} / ${filteredCards.length}`;
        }

        function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
        function updateCardDisplay() { renderCard(); }
        function prevCard() { if (currentIndex > 0) { currentIndex--; resetFlipAndRender(); } }
        function nextCard() { if (currentIndex < filteredCards.length - 1) { currentIndex++; resetFlipAndRender(); } }
        function resetFlipAndRender() { document.getElementById('card').classList.remove('flipped'); setTimeout(renderCard, 150); }

        function playSpeech() {
            const currentLang = document.getElementById('langSelect').value;
            const preferredGender = document.getElementById('genderSelect').value;
            const cardData = filteredCards[currentIndex];
            const text = cardData[currentLang] ? cardData[currentLang].word : cardData['zh'].word;

            const langCodeMap = { zh: 'zh-TW', en: 'en-US', vi: 'vi-VN', id: 'id-ID', balinese: 'id-ID' };
            const targetLang = langCodeMap[currentLang] || 'zh-TW';

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = targetLang;

                // 搜尋設備上對應語言與性別的語音
                if (availableVoices.length === 0) loadVoices();
                const matchedVoices = availableVoices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(targetLang.slice(0, 2).toLowerCase()));

                if (matchedVoices.length > 0) {
                    let chosenVoice = matchedVoices.find(v => {
                        const name = v.name.toLowerCase();
                        if (preferredGender === 'male') {
                            return name.includes('male') || name.includes('david') || name.includes('george') || name.includes('kangkang') || name.includes('boy') || name.includes('man');
                        } else {
                            return name.includes('female') || name.includes('zira') || name.includes('yating') || name.includes('hsiao') || name.includes('girl') || name.includes('woman') || name.includes('mei-jia');
                        }
                    });

                    if (!chosenVoice) chosenVoice = matchedVoices[0]; // 若找不到完全符合性別名稱的則用預設語音
                    utterance.voice = chosenVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援語音播放功能。");
            }
        }

        renderCard();
    </script>
</body>
</html>
